name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"

jobs:
  backend:
    name: Backend (nest-backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nest-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: doxa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/doxa_test?schema=public"
      PORT: "3000"
      WEB_ORIGINS: "http://localhost:3001"
      # Dummy auth/storage secrets - AuthModule and AssetModule validate these
      # are non-empty at Nest DI bootstrap (see google.strategy.ts,
      # jwt.strategy.ts, asset-storage.providers.ts), even though the one
      # e2e spec today never exercises OAuth or S3. None of these are real.
      GOOGLE_CLIENT_ID: "ci-placeholder-client-id"
      GOOGLE_CLIENT_SECRET: "ci-placeholder-client-secret"
      GOOGLE_CALLBACK_URL: "http://localhost:3000/auth/google/callback"
      JWT_SECRET: "ci-placeholder-jwt-secret-not-for-real-use"
      JWT_EXPIRES_IN_DAYS: "7"
      ADMIN_WEB_URL: "http://localhost:3001"
      BOOTSTRAP_ADMIN_EMAIL: "admin@example.com"
      S3_ACCESS_KEY_ID: "ci-placeholder-key"
      S3_SECRET_ACCESS_KEY: "ci-placeholder-secret"
      S3_BUCKET: "doxa-assets-ci"
      S3_REGION: "us-east-1"
      S3_INTERNAL_ENDPOINT: "http://localhost:9000"
      S3_PUBLIC_ENDPOINT: "http://localhost:9000"
      ASSET_PUBLIC_BASE_URL: "http://localhost:9000/doxa-assets-ci"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Unit tests
        run: bun run test

      - name: Apply migrations
        run: bun run db:migrate:deploy

      - name: E2E tests
        run: bun run test:e2e

  frontend:
    name: Frontend (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_API_URL: "http://localhost:3000"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3001"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
